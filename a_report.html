    <script>
        // Initialize
        function initializeReport() {
            // Set report date with time in Korean timezone
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                weekday: 'long',
                timeZone: 'Asia/Seoul'
            };
            const dateStr = new Intl.DateTimeFormat('ko-KR', options).format(now);
            document.getElementById('reportDate').textContent = dateStr + ' (?œêµ­ ?œê°„)';

            const options2 = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                timeZone: 'Asia/Seoul'
            };
            const dateStr2 = new Intl.DateTimeFormat('ko-KR', options2).format(now);
            document.getElementById('reportDate2').textContent = dateStr2 + ' (?œêµ­ ?œê°„)';

            const lastUpdate = localStorage.getItem('reportLastUpdate');
            if (lastUpdate) {
                document.getElementById('lastUpdateTime').textContent = lastUpdate;
            }

            // Update date range for last 7 days
            updateDateRange();
            drawChart();
        }

        // Calculate and display last 7 days date range
        function updateDateRange() {
            const today = new Date();
            const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

            const formatDate = (date) => {
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${month}/${day}`;
            };

            const dateRange = formatDate(sevenDaysAgo) + ' ~ ' + formatDate(today);
            document.getElementById('dateRange').textContent = '(' + dateRange + ')';
        }

        // Update Handler
        function handleUpdate() {
            const today = new Date().toISOString().split('T')[0];
            const lastUpdate = localStorage.getItem('reportLastUpdate');

            const statusEl = document.getElementById('updateStatus');

            if (lastUpdate === today) {
                // ?¤ëŠ˜ ?´ë? ?…ë°?´íŠ¸??                statusEl.className = 'update-status show warning';
                statusEl.innerHTML = '? ï¸ <strong>There is no update</strong><br>Today\'s report has already been updated.';
                setTimeout(() => {
                    statusEl.classList.remove('show');
                }, 4000);
            } else {
                // ì²??…ë°?´íŠ¸
                statusEl.className = 'update-status show info';
                statusEl.innerHTML = '??<strong>Updating...</strong><br>Fetching latest news and generating report...';

                // ?¤ì œë¡œëŠ” ?¬ê¸°??Claude?ê²Œ ?…ë°?´íŠ¸ ?”ì²­?´ì•¼ ??                // ì§€ê¸ˆì? ?œë??ˆì´??                setTimeout(() => {
                    localStorage.setItem('reportLastUpdate', today);
                    const now = new Date().toLocaleString('ko-KR');
                    document.getElementById('lastUpdateTime').textContent = now;

                    statusEl.className = 'update-status show success';
                    statusEl.innerHTML = '??<strong>Report Updated</strong><br>Latest data has been loaded successfully.';

                    setTimeout(() => {
                        statusEl.classList.remove('show');
                    }, 3000);
                }, 2000);
            }
        }

        // Chart Data Labels Plugin
        const chartDataLabelsPlugin = {
            id: 'chartDataLabels',
            afterDatasetsDraw(chart) {
                const {ctx} = chart;
                chart.data.datasets.forEach((dataset, datasetIndex) => {
                    const meta = chart.getDatasetMeta(datasetIndex);
                    if (!meta.hidden) {
                        meta.data.forEach((datapoint, index) => {
                            const data = dataset.data[index];
                            const {x, y} = datapoint.getProps(['x', 'y']);

                            ctx.fillStyle = '#1565c0';
                            ctx.font = 'bold 11px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.fillText(data.toFixed(2) + '%', x, y - 12);
                        });
                    }
                });
            }
        };

        // Chart
        function drawChart() {
            const ctx = document.getElementById('rateChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {

        // Show Citation Popup
        function showPopup(category, itemId) {
            const modal = document.getElementById('citationModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');

            const citations = citationData[category][itemId];
            const categoryLabel = category === 'news' ? '?´ìŠ¤' : category === 'positive' ? 'ê¸ì • ?¼ë“œë°? : 'ë¶€???¼ë“œë°?;

            modalTitle.textContent = categoryLabel + ' - ?¸ìš© ì¶œì²˜ (' + citations.length + '??';

            let html = '<ul style="list-style: none; padding: 0; margin: 0;">';
            citations.forEach((cite, idx) => {
                html += '<li style="margin-bottom: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #1565c0; border-radius: 4px;">';
                html += '<div style="font-weight: 600; margin-bottom: 4px;"><a href="' + cite.url + '" target="_blank" style="color: #1565c0; text-decoration: none;">' + cite.media + '</a></div>';
                html += '<div style="font-size: 11px; color: #666;">?“… ' + cite.date + '</div>';
                html += '</li>';
            });
            html += '</ul>';

            modalContent.innerHTML = html;
            modal.style.display = 'flex';
        }

        // Close Citation Popup
        function closePopup() {
            document.getElementById('citationModal').style.display = 'none';
        }

        // Close popup when clicking outside
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('citationModal');
            if (e.target === modal) {
                closePopup();
            }
        });

        // Load Archive List
        async function loadArchiveList() {
            try {
                const response = await fetch('archive.json');
                if (!response.ok) return;

                const archiveData = await response.json();
                const selector = document.getElementById('dateSelector');

                archiveData.dates.forEach(dateTime => {
                    const option = document.createElement('option');
                    option.value = dateTime;

                    // Format: "2026-08-31-6am" ??"2026-08-31 (6am KST)"
                    const lastDashIndex = dateTime.lastIndexOf('-');
                    if (lastDashIndex > 0) {
                        const date = dateTime.substring(0, lastDashIndex);
                        const time = dateTime.substring(lastDashIndex + 1);
                        option.textContent = `${date} (${time} KST)`;
                    } else {
                        option.textContent = dateTime;
                    }

                    selector.appendChild(option);
                });
            } catch (error) {
                console.log('Archive not available yet');
            }
        }

        // Load Archived Report
        function loadArchivedReport() {
            const selector = document.getElementById('dateSelector');
            const selectedDate = selector.value;

            if (!selectedDate) return;

            // Format: "2026-08-31-6am" ??"archive/a_report_20260831_6am.html"
            const lastDashIndex = selectedDate.lastIndexOf('-');
            const date = selectedDate.substring(0, lastDashIndex).replace(/-/g, '');
            const time = selectedDate.substring(lastDashIndex + 1);
            const archiveFile = `archive/a_report_${date}_${time}.html`;
            window.open(archiveFile, '_blank');
        }

        // Load
        window.addEventListener('load', function() {
            initializeReport();
            loadArchiveList();
        });
